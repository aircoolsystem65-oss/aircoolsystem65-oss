<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Confirmed | Air Cool System</title>
    <meta
      name="description"
      content="Your Air Cool System service request has been received. Our team will call you back shortly."
    />

    <link rel="icon" type="image/jpeg" href="images/common/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background:
          radial-gradient(circle at 15% 15%, rgba(74, 222, 128, 0.35), transparent 45%),
          radial-gradient(circle at 90% 90%, rgba(255, 215, 0, 0.25), transparent 45%),
          linear-gradient(135deg, #052a10, #0b7a36 55%, #3a9d12);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #334155;
      }
      .thankyou-wrapper {
        width: 100%;
        max-width: 440px;
        padding: 20px;
      }
      .thankyou-card {
        background: #ffffff;
        padding: 45px 30px;
        border-radius: 20px;
        box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
        text-align: center;
        border: 1px solid #f1f5f9;
      }
      .success-icon-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 24px auto;
      }
      .success-pulse {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #dcfce7;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }
      .success-icon {
        position: relative;
        width: 80px;
        height: 80px;
        background: #22c55e;
        color: #ffffff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.8;
        }
        70% {
          transform: scale(1.25);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
      }
      p {
        font-size: 0.95rem;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .highlight-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.9rem;
        color: #0f172a;
        font-weight: 600;
        margin-bottom: 28px;
      }
      .btn-home {
        display: block;
        width: 100%;
        background: #2563eb;
        color: #ffffff;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
        transition: all 0.25s ease;
      }
      .btn-home:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 14px 24px rgba(37, 99, 235, 0.35);
      }
      .btn-home:active {
        transform: translateY(0);
      }

      .ty-brand {
        font-weight: 800;
        font-size: 1.5rem;
        margin-bottom: 14px;
        letter-spacing: 0.01em;
        background: linear-gradient(
          100deg,
          #b8860b 0%,
          #ffb800 20%,
          #0b7a36 50%,
          #ffb800 80%,
          #b8860b 100%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: tyShine 4s linear infinite;
      }
      @keyframes tyShine {
        0% {
          background-position: 0 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }
      h1 {
        background: linear-gradient(90deg, #064e2a, #12a150 60%, #d99a00);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      .btn-home {
        background: linear-gradient(135deg, #ffb800, #ffd700 45%, #ff9500) !important;
        color: #2a1d00 !important;
        box-shadow: 0 10px 22px rgba(255, 170, 0, 0.45) !important;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="thankyou-wrapper">
      <div class="thankyou-card">
        <div class="ty-brand">Air Cool System</div>
        <div class="success-icon-wrapper">
          <div class="success-pulse"></div>
          <div class="success-icon">✓</div>
        </div>

        <h1>Booking Request Received!</h1>

        <p>
          Thank you for choosing <strong>Air Cool System</strong>. Your service request has been
          successfully submitted.
        </p>

        <div class="highlight-box">
          ⏳ Hamari team 10 minute ke andar aapko call back karegi. Kripya intezaar karein.
        </div>

        <a href="index.html" class="btn-home">Back to Home Page</a>
      </div>
    </div>
  </body>
</html>
